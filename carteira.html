<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carteira | Painel de Investimentos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <!-- Carregado no topo de propósito: aplica o tema antes da página aparecer -->
  <script src="js/tema.js"></script>
  <!-- defer: só roda depois que o HTML inteiro carregar (o formulário já vai existir) -->
  <script src="js/carteira.js" defer></script>
</head>
<body>

  <header class="topo">
    <h1>Painel de Investimentos</h1>
    <!-- Menu de navegação: no PC fica no topo; no celular, barra fixa embaixo -->
    <nav class="menu" aria-label="Menu principal">
      <ul>
        <li><a href="index.html">Início</a></li>
        <!-- Esta é a página atual -->
        <li><a href="carteira.html" aria-current="page">Carteira</a></li>
        <!-- Ainda não existe: vai dar erro 404 até criarmos a página -->
        <li><a href="observacao.html">Observação</a></li>
      </ul>
    </nav>
    <div class="topo-acoes">
      <p class="atualizado">Atualizado às <time>10:30</time></p>
      <button type="button" class="botao-tema" id="botao-tema" aria-pressed="false">
        Modo escuro
      </button>
    </div>
  </header>

  <main class="pagina-carteira">

    <!-- Lista completa: cada compra com quantidade, preço médio e resultado -->
    <section class="carteira-completa" aria-labelledby="titulo-carteira">
      <h2 id="titulo-carteira">Minha carteira</h2>
      <!-- Resumo e lista vêm do banco: o js/carteira.js preenche ao abrir a página -->
      <p class="descricao" id="resumo-carteira">Carregando suas compras…</p>

      <!-- Começa vazia: cada compra salva vira um <li> aqui -->
      <ul class="lista-posicoes" id="lista-posicoes"></ul>
    </section>

    <!-- Cadastro de ativo: registrar uma compra nova -->
    <section class="cadastro" aria-labelledby="titulo-cadastro">
      <h2 id="titulo-cadastro">Cadastrar compra</h2>
      <p class="descricao">
        A compra fica salva no banco de dados: aparece igual no PC e no celular.
      </p>

      <!-- id="form-compra": é por esse nome que o JavaScript acha o cadastro -->
      <form class="form-compra" id="form-compra">
        <!-- Cada campo tem um <label>: clicar no texto foca o campo, e leitores de tela leem o nome -->
        <div class="campo">
          <label for="ativo">Ativo</label>
          <input type="text" id="ativo" name="ativo" placeholder="Ex.: PETR4" required>
        </div>

        <div class="campo">
          <label for="tipo">Tipo</label>
          <select id="tipo" name="tipo" required>
            <option value="Ação">Ação</option>
            <option value="FII">Fundo imobiliário (FII)</option>
            <option value="ETF">ETF</option>
            <option value="BDR">BDR</option>
            <option value="Cripto">Cripto</option>
            <option value="Tesouro Direto">Tesouro Direto</option>
            <option value="Outro">Outro</option>
          </select>
        </div>

        <div class="campo">
          <label for="quantidade">Quantidade</label>
          <!-- step="any": aceita números quebrados, como 0,0004 de Bitcoin -->
          <input type="number" id="quantidade" name="quantidade" min="0" step="any" required>
        </div>

        <div class="campo">
          <label for="preco">Preço pago por unidade (R$)</label>
          <input type="number" id="preco" name="preco" min="0" step="0.01" required>
        </div>

        <div class="campo">
          <label for="data">Data da compra</label>
          <input type="date" id="data" name="data" required>
        </div>

        <button type="submit" class="botao-primario" id="botao-adicionar">Adicionar compra</button>

        <!-- Mensagem de confirmação: começa vazia; o JavaScript escreve aqui depois do cadastro.
             role="status" faz leitores de tela anunciarem a mensagem quando ela aparece -->
        <p class="mensagem-cadastro" id="mensagem-cadastro" role="status"></p>
      </form>
    </section>

  </main>

  <footer class="rodape">
    <p>Dados de exemplo. Não é recomendação de investimento.</p>
  </footer>

</body>
</html>
